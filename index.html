<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English to SiSwati Translator Dictionary</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>ENGLISH TO SISWATI TRANSLATOR DICTIONARY</h1>
    <div id="search-tab">
      <input placeholder="Search words here" id="search-input" type="search" />
      <button type="button" id="search-button">Search</button>
    </div>
    <div id="number-list"></div>
    <template id="counting">
      <div class="card">
        <h2 class="one-english"></h2>
        <p>SiSwati: <span class="one-swati"></span></p>
      </div>
    </template>
    <template id="learn-siswati">
      <h2 class="today">Word of the day</h2>
      <div class="word-of-the-day">Scalp</div>

      <ul class="number-outputs">
        <li class="one-english"></li>
        <li class="one-swati"></li>
        <li class="two"></li>
        <li class="three"></li>
        <li class="four"></li>
        <li class="five"></li>
        <li class="six"></li>
        <li class="seven"></li>
        <li class="eight"></li>
        <li class="nine"></li>
        <li class="ten"></li>
      </ul>
      <h2 class="months">Months Of The Year</h2>
      <ul class="months-outputs">
        <li class="january"></li>
        <li class="february"></li>
        <li class="march"></li>
        <li class="april"></li>
        <li class="may"></li>
        <li class="june"></li>
        <li class="july"></li>
        <li class="august"></li>
        <li class="september"></li>
        <li class="october"></li>
        <li class="november"></li>
        <li class="december"></li>
      </ul>
    </template>
    <section id="sidebar">
      <h2 id="alphabetical">A-Z</h2>
      <h3>Animals</h3>
      <h3>Idioms</h3>
      <h4>Formal/Respectable terminology</h4>
      <h4>Conversational substitutes</h4>
    </section>
  </body>
  <script src="script.js"></script>
</html>
