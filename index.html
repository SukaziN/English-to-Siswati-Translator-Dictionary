<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English to SiSwati Translator Dictionary</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>ENGLISH TO SISWATI TRANSLATOR DICTIONARY</h1>
    <div id="icons">
      <span class="icon"
        ><img src="icons/Home.png" alt="home icon" />
        <figcaption>Home</figcaption></span
      >
      <span class="icon">
        <img src="icons/AtoZ.png" alt="a-z alphabetical sorting icon" />
        <figcaption>Alphabetical order</figcaption></span
      ><span class="icon">
        <img src="icons/Numbers.png" alt="numbers icon" />
        <figcaption>Numbers</figcaption></span
      >
      <span class="icon">
        <img
          src="icons/Days.png"
          alt="days of the week icon"
          onclick="showDays(day)"
        />
        <figcaption onclick="showDays(day)">Days</figcaption></span
      >
      <span class="icon">
        <img src="icons/Months.png" alt="months of the year icon" />
        <figcaption>Months</figcaption></span
      >
      <span class="icon">
        <img src="icons/Animals.png" alt="animals icon" />
        <figcaption>Animals</figcaption></span
      >
      <span class="icon">
        <img src="icons/Anatomy.png" alt="parts of the body icon" />
        <figcaption>Body Parts</figcaption></span
      >
      <span class="icon">
        <img src="icons/Formal.png" alt="formal terminology icon" />
        <figcaption>Formal</figcaption></span
      >
      <span class="icon">
        <img src="icons/Conversational.png" alt="idioms icon" />
        <figcaption>Idioms</figcaption></span
      >
    </div>
    <hr />
    <div id="search-tab">
      <input placeholder="Search words here" id="search-input" type="search" />
      <button type="button" id="search-button">Translate</button>
    </div>
    <div id="loading">Searching, please wait...</div>
    <div id="error"></div>
    <span>
      <div id="swati-output"></div>
      <div id="output"></div>
    </span>
  </body>
  <script src="script.js" defer></script>
</html>
